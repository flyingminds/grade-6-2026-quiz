  .opt.incorrect { background: #fee2e2; border-color: #ef4444; color: #991b1b; }

const LETTERS = ["A","B","C","D"];
const answered = new Array(QUESTIONS.length).fill(false);
let correctCount = 0;
let wrongCount = 0;

function renderQuiz() {
  const root = document.getElementById("quiz");
  root.innerHTML = "";
  QUESTIONS.forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "question";

    const qtext = document.createElement("div");
    qtext.className = "qtext";
    qtext.innerHTML = `<span class="qnum">${i+1}.</span>${escapeHtml(item.q)}`;
    card.appendChild(qtext);

    const opts = document.createElement("div");
    opts.className = "options";
    item.o.forEach((text, j) => {
      const btn = document.createElement("button");
      btn.className = "opt";
      btn.innerHTML = `<span class="letter">${LETTERS[j]}</span>${escapeHtml(text)}`;
      btn.onclick = () => handleClick(i, j, opts, fb);
      opts.appendChild(btn);
    });
    card.appendChild(opts);

    const fb = document.createElement("div");
    fb.className = "feedback";
    card.appendChild(fb);

    root.appendChild(card);
  });
  document.getElementById("total").textContent = QUESTIONS.length;
  updateScore();
}

function handleClick(qi, oi, optsEl, fbEl) {
  if (answered[qi]) return;
  answered[qi] = true;
  const correct = QUESTIONS[qi].a;
  const buttons = optsEl.querySelectorAll("button");
  buttons.forEach((b, idx) => {
    b.disabled = true;
    if (idx === correct) b.classList.add("correct");
    if (idx === oi && oi !== correct) b.classList.add("incorrect");
  });
  if (oi === correct) {
    correctCount++;
    fbEl.className = "feedback show right";
    fbEl.textContent = "Correct!";
  } else {
    wrongCount++;
    fbEl.className = "feedback show wrong";
    fbEl.textContent = `Incorrect. The correct answer is ${LETTERS[correct]}.`;
  }
  updateScore();
}

function updateScore() {
  document.getElementById("correctCount").textContent = correctCount;
  document.getElementById("wrongCount").textContent = wrongCount;
  document.getElementById("answered").textContent = answered.filter(Boolean).length;
}

function resetQuiz() {
  for (let i = 0; i < answered.length; i++) answered[i] = false;
  correctCount = 0;
  wrongCount = 0;
  renderQuiz();
  window.scrollTo({top: 0, behavior: "smooth"});
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

renderQuiz();
</script>
